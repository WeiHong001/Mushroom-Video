plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.mogu.inspector'
    compileSdk 36
    defaultConfig { minSdk 26; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    testOptions.unitTests {
        includeAndroidResources = true
        all {
            systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
            maxHeapSize = '2g'
            // Chucker Room collectors outlive a sandbox; do not share SQLite across classes.
            forkEvery = 1
        }
    }
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation platform('androidx.compose:compose-bom:2026.05.00')
    implementation 'androidx.compose.runtime:runtime'
    debugImplementation('com.github.chuckerteam.chucker:library:4.1.0') {
        attributes { attribute(Attribute.of('com.mogu.chucker.display', Boolean), true) }
    }
    debugImplementation 'androidx.appcompat:appcompat:1.7.0'
    debugImplementation 'androidx.recyclerview:recyclerview:1.3.0'
    debugImplementation 'androidx.compose.foundation:foundation'
    debugImplementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.activity:activity-compose:1.9.2'
    debugImplementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.5'
    // The activity belongs to the unit-test host, not to the application APK.
    testDebugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}

apply from: 'chucker-display.gradle.kts'
