plugins { id 'com.android.application' }
apply from: rootProject.file('tools/business-abi.gradle')

def researchConfig = new Properties()
def configFile = rootProject.file('research.local.properties')
if (configFile.exists()) configFile.withInputStream { researchConfig.load(it) }
def researchMode = researchConfig.getProperty('mode', 'offline')
if (!(researchMode in ['offline', 'live'])) throw new GradleException('mode must be offline or live')

android {
    namespace 'com.amogu6.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.amogu6.tv.research'
        minSdk 21
        targetSdk 32
        versionCode 14
        versionName '1.1.4-research'
        resValue 'string', 'research_app_name', researchMode == 'offline' ? '蘑菇视频 · 离线研究' : '蘑菇视频 · 只读研究'
        buildConfigField 'boolean', 'OFFLINE', (researchMode == 'offline').toString()
        buildConfigField 'String', 'API_BASE', '"' + researchConfig.getProperty('apiBase', 'https://api.mgsp.ltd').replace('"', '') + '"'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [researchAuthorities: 'com.amogu6.tv.research']
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets { test.resources.srcDir('src/main/assets/research') }
    androidResources {
        additionalParameters += ['--stable-ids', file('resource-ids.txt').absolutePath]
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
    }
    lint { abortOnError false }
}

configurations {
    smaliTool
    configureEach { exclude group: 'org.eclipse.jetty.orbit', module: 'javax.servlet' }
}
tasks.configureEach { task ->
    if(task.name.startsWith('process') && task.name.endsWith('Resources')) task.inputs.file(file('resource-ids.txt'))
}
