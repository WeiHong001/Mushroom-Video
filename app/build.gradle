// Preserve unrecoverable Kotlin control flow as editable, assembled company code.
def assembleBusinessDex = tasks.register('assembleBusinessDex', JavaExec) {
    classpath = configurations.smaliTool
    mainClass = 'org.jf.smali.Main'
    inputs.dir('src/main/smali')
    inputs.dir('src/main/recovered-libraries')
    outputs.file(layout.buildDirectory.file('recovered/classes.dex'))
    doFirst {
        layout.buildDirectory.dir('recovered').get().asFile.mkdirs()
        args = ['assemble', '--api', '32', 'src/main/smali', 'src/main/recovered-libraries', '-o', layout.buildDirectory.file('recovered/classes.dex').get().asFile.absolutePath]
        workingDir = projectDir
    }
}

['Debug', 'Release'].each { variant ->
    def mode = variant.toLowerCase()
    def integrate = tasks.register("integrate${variant}BusinessDex") {
        dependsOn assembleBusinessDex
        doLast {
            def dir = layout.buildDirectory.dir("outputs/apk/${mode}").get().asFile
            def apk = new File(dir, "app-${mode}.apk")
            def staged = new File(dir, "business-unsigned.zip")
            def aligned = new File(dir, "business-aligned.zip")
            def dex = layout.buildDirectory.file('recovered/classes.dex').get().asFile
            int dexNumber = 2
            new java.util.zip.ZipFile(apk).withCloseable { original ->
                def marker='META-INF/mushroom-recovered-dex.txt'
                def previous=original.getEntry(marker)
                def oldDex=previous ? original.getInputStream(previous).withCloseable { it.getText('UTF-8').trim() } : null
                def entries = Collections.list(original.entries()).findAll { it.name!=marker && it.name!=oldDex }
                while (entries.any { it.name == "classes${dexNumber}.dex" }) dexNumber++
                new java.util.zip.ZipOutputStream(new FileOutputStream(staged)).withCloseable { output ->
                    entries.findAll { !(it.name ==~ /META-INF\/.*\.(SF|RSA|DSA|EC)/) }.each { entry ->
                        def copy=new java.util.zip.ZipEntry(entry.name)
                        copy.method=entry.method
                        if(entry.method==java.util.zip.ZipEntry.STORED) {
                            copy.size=entry.size
                            copy.compressedSize=entry.size
                            copy.crc=entry.crc
                        }
                        output.putNextEntry(copy)
                        if (!entry.directory) original.getInputStream(entry).withCloseable { output << it }
                        output.closeEntry()
                    }
                    output.putNextEntry(new java.util.zip.ZipEntry("classes${dexNumber}.dex"))
                    dex.withInputStream { output << it }
                    output.closeEntry()
                    output.putNextEntry(new java.util.zip.ZipEntry(marker))
                    output.write("classes${dexNumber}.dex".getBytes('UTF-8'))
                    output.closeEntry()
                }
            }
            def windows = System.getProperty('os.name').toLowerCase().contains('windows')
            def buildTools = new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}")
            exec { commandLine new File(buildTools, windows ? 'zipalign.exe' : 'zipalign'), '-p', '-f', '4', staged, aligned }
            def signing = android.signingConfigs.debug
            exec { commandLine new File(buildTools, windows ? 'apksigner.bat' : 'apksigner'), 'sign', '--ks', signing.storeFile, '--ks-key-alias', signing.keyAlias, '--ks-pass', "pass:${signing.storePassword}", '--key-pass', "pass:${signing.keyPassword}", '--out', apk, aligned }
            staged.delete()
            aligned.delete()
        }
    }
    tasks.configureEach { task ->
        if (task.name == "package${variant}") task.finalizedBy(integrate)
        if (task.name in ["assemble${variant}", "install${variant}"]) task.dependsOn(integrate)
    }
    integrate.configure { mustRunAfter "package${variant}" }
}
